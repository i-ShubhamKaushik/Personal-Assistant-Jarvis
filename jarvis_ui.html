<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#00A8FF;
    --cyan:#00FFF7;
    --bg:#080C14;
    --panel:rgba(0,168,255,0.04);
    --border:rgba(0,168,255,0.12);
    --muted:#1A4A5A;
    --text-dim:#2A6A7A;
  }
  html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace}

  /* grid overlay */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(0,168,255,0.025) 60px),
      repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(0,168,255,0.025) 60px);
  }

  .hud{
    width:520px;
    display:flex;flex-direction:column;align-items:center;gap:18px;
    position:relative;z-index:1;
  }

  /* ── HEADER ── */
  .header{display:flex;align-items:center;justify-content:space-between;width:100%}
  .logo{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:700;color:var(--blue);letter-spacing:8px}
  .conn-badge{
    display:flex;align-items:center;gap:6px;
    font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;
  }
  .conn-dot{width:6px;height:6px;border-radius:50%;background:#1A2A2A;transition:background 0.4s}
  .conn-dot.on{background:var(--cyan)}
  .version{font-size:9px;color:#152535;letter-spacing:2px}

  /* ── RING ── */
  .ring-wrap{position:relative;width:220px;height:220px}
  .ring-svg{width:220px;height:220px;display:block}
  .ring-label{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;pointer-events:none;
  }
  .state-text{
    font-family:'Orbitron',sans-serif;font-size:12px;font-weight:500;
    letter-spacing:4px;color:var(--blue);text-transform:uppercase;
    transition:color 0.5s;
  }
  .state-sub{font-size:9px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase}

  /* ── PANELS ── */
  .panels{display:flex;gap:10px;width:100%}
  .panel{
    flex:1;background:var(--panel);border:0.5px solid var(--border);
    border-radius:8px;padding:10px 12px;
  }
  .panel-label{font-size:8px;letter-spacing:3px;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
  .panel-val{font-family:'Orbitron',sans-serif;font-size:15px;color:var(--blue);font-weight:500}

  /* ── LOG ── */
  .log{
    width:100%;background:rgba(0,5,15,0.7);border:0.5px solid rgba(0,168,255,0.08);
    border-radius:8px;padding:10px 12px;height:130px;overflow-y:auto;
  }
  .log::-webkit-scrollbar{width:2px}
  .log::-webkit-scrollbar-thumb{background:#0A2030;border-radius:2px}
  .log-entry{font-size:11px;line-height:1.85;display:flex;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log-entry .ts{color:#0E2535;flex-shrink:0;font-size:10px}
  .t-sys{color:#1A5A7A}
  .t-heard{color:#2A7A5A}
  .t-cmd{color:var(--blue)}
  .t-jarvis{color:var(--cyan)}
  .t-wake{color:#00D4FF}
  .t-err{color:#4A3A1A}

  /* ── INPUT ── */
  .input-row{display:flex;gap:8px;width:100%}
  .cmd-input{
    flex:1;background:rgba(0,168,255,0.04);border:0.5px solid rgba(0,168,255,0.15);
    border-radius:6px;padding:9px 13px;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:#4AB0CC;
    outline:none;transition:border-color 0.2s;
  }
  .cmd-input::placeholder{color:#122030}
  .cmd-input:focus{border-color:rgba(0,168,255,0.4)}
  .send-btn{
    background:rgba(0,168,255,0.07);border:0.5px solid rgba(0,168,255,0.25);
    border-radius:6px;padding:9px 16px;
    font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--blue);letter-spacing:1px;cursor:pointer;
    text-transform:uppercase;transition:background 0.2s;
  }
  .send-btn:hover{background:rgba(0,168,255,0.14)}
  .send-btn:active{transform:scale(0.97)}

  /* ── CHIPS ── */
  .chips{display:flex;gap:8px;width:100%}
  .chip{
    flex:1;background:rgba(0,168,255,0.03);border:0.5px solid rgba(0,168,255,0.07);
    border-radius:6px;padding:8px 4px;text-align:center;
    font-size:9px;letter-spacing:2px;color:#1A4A5A;text-transform:uppercase;
    cursor:default;transition:border-color 0.3s,color 0.3s;
  }
  .chip.lit{border-color:rgba(0,168,255,0.35);color:var(--blue)}

  hr.div{width:100%;border:none;border-top:0.5px solid rgba(0,168,255,0.06)}

  /* ── SCAN LINE ── */
  @keyframes scan{0%{top:-4px}100%{top:100%}}
  .scanline{
    position:fixed;left:0;width:100%;height:2px;pointer-events:none;
    background:linear-gradient(transparent,rgba(0,168,255,0.06),transparent);
    animation:scan 6s linear infinite;z-index:0;
  }
</style>
</head>
<body>
<div class="scanline"></div>
<div class="hud">

  <div class="header">
    <div class="logo">JARVIS</div>
    <div class="conn-badge">
      <div class="conn-dot" id="connDot"></div>
      <span id="connLabel">DISCONNECTED</span>
    </div>
    <div class="version" id="versionLabel">v1.0</div>
  </div>

  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <!-- static guide rings -->
      <circle cx="110" cy="110" r="100" fill="none" stroke="rgba(0,168,255,0.05)" stroke-width="1"/>
      <circle cx="110" cy="110" r="88"  fill="none" stroke="rgba(0,168,255,0.04)" stroke-width="0.5"/>
      <circle cx="110" cy="110" r="76"  fill="none" stroke="rgba(0,168,255,0.07)" stroke-width="0.5"/>
      <!-- animated arcs -->
      <circle id="ringOuter" cx="110" cy="110" r="100" fill="none"
        stroke="#00A8FF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"
        stroke-dasharray="628.3" stroke-dashoffset="628.3"
        transform="rotate(-90 110 110)"/>
      <circle id="ringInner" cx="110" cy="110" r="76" fill="none"
        stroke="#00FFF7" stroke-width="1" stroke-linecap="round" stroke-opacity="0.45"
        stroke-dasharray="477.5" stroke-dashoffset="477.5"
        transform="rotate(-90 110 110)"/>
      <!-- audio bars -->
      <g id="bars"></g>
      <!-- center disc -->
      <circle cx="110" cy="110" r="50"
        fill="rgba(0,168,255,0.04)" stroke="rgba(0,168,255,0.10)" stroke-width="0.5"/>
    </svg>
    <div class="ring-label">
      <div class="state-text" id="stateText">OFFLINE</div>
      <div class="state-sub"  id="stateSub">CONNECTING...</div>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-label">Commands</div>
      <div class="panel-val" id="cmdCount">0</div>
    </div>
    <div class="panel">
      <div class="panel-label">Status</div>
      <div class="panel-val" id="statVal" style="font-size:11px;letter-spacing:1px">OFFLINE</div>
    </div>
    <div class="panel">
      <div class="panel-label">Uptime</div>
      <div class="panel-val" id="uptimeVal">00:00</div>
    </div>
  </div>

  <div class="log" id="logBox"></div>

  <div class="input-row">
    <input class="cmd-input" id="cmdInput" placeholder="Type a command, Boss..." autocomplete="off"/>
    <button class="send-btn" id="sendBtn">Send</button>
  </div>

  <hr class="div"/>

  <div class="chips">
    <div class="chip" id="chipStandby">Standby</div>
    <div class="chip" id="chipWake">Wake Word</div>
    <div class="chip" id="chipActive">Active</div>
    <div class="chip" id="chipThinking">Thinking</div>
  </div>

</div>

<script>
const WS_URL = 'ws://localhost:6789';
const OUTER_CIRC = 2 * Math.PI * 100;
const INNER_CIRC = 2 * Math.PI * 76;

let outerTarget = 0, innerTarget = 0;
let outerCur = 0, innerCur = 0;
let barsData = Array(28).fill(0.05);
let currentState = 'offline';
let cmdCount = 0;
let startTime = Date.now();
let ws = null;
let reconnectTimer = null;

const STATE_CFG = {
  offline:   {outer:0.00, inner:0.00, text:'OFFLINE',    sub:'CONNECTING...'},
  standby:   {outer:0.08, inner:0.00, text:'STANDBY',    sub:'SAY · JARVIS'},
  wake:      {outer:0.40, inner:0.20, text:'WAKE WORD',  sub:'DETECTED'},
  active:    {outer:0.88, inner:0.65, text:'ACTIVE',     sub:'AWAITING COMMAND'},
  thinking:  {outer:1.00, inner:0.92, text:'THINKING',   sub:'PROCESSING...'},
  mute:      {outer:0.02, inner:0.00, text:'MUTED',      sub:'OFFLINE'},
};

const CHIP_MAP = {standby:'chipStandby', wake:'chipWake', active:'chipActive', thinking:'chipThinking'};

function applyState(s) {
  currentState = s;
  const cfg = STATE_CFG[s] || STATE_CFG.offline;
  outerTarget = cfg.outer;
  innerTarget = cfg.inner;
  document.getElementById('stateText').textContent = cfg.text;
  document.getElementById('stateSub').textContent  = cfg.sub;
  document.getElementById('statVal').textContent   = cfg.text;
  Object.entries(CHIP_MAP).forEach(([k,id]) => {
    document.getElementById(id).className = 'chip' + (k === s ? ' lit' : '');
  });
}

function log(kind, text) {
  const box = document.getElementById('logBox');
  const ts  = new Date().toLocaleTimeString('en-GB',{hour12:false});
  const div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = `<span class="ts">${ts}</span><span class="t-${kind}">${escHtml(text)}</span>`;
  box.appendChild(div);
  if (box.children.length > 200) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
  if (kind === 'cmd') cmdCount++;
  document.getElementById('cmdCount').textContent = cmdCount;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function lerp(a,b,t){ return a + (b-a)*t; }

function animate() {
  outerCur = lerp(outerCur, outerTarget, 0.055);
  innerCur = lerp(innerCur, innerTarget, 0.055);
  document.getElementById('ringOuter').style.strokeDashoffset = OUTER_CIRC*(1-outerCur);
  document.getElementById('ringInner').style.strokeDashoffset = INNER_CIRC*(1-innerCur);

  const active = currentState === 'active' || currentState === 'thinking';
  const waking = currentState === 'wake';
  const count = 28;
  for (let i = 0; i < count; i++) {
    if (active)      barsData[i] = lerp(barsData[i], 0.15 + Math.random()*0.72, 0.32);
    else if (waking) barsData[i] = lerp(barsData[i], 0.05 + Math.random()*0.28, 0.20);
    else             barsData[i] = lerp(barsData[i], 0.02 + Math.sin(Date.now()/900+i)*0.04, 0.10);
  }

  let html = '';
  for (let i = 0; i < count; i++) {
    const a  = (i/count)*2*Math.PI - Math.PI/2;
    const r1 = 60, r2 = 60 + barsData[i]*20;
    const x1 = 110 + r1*Math.cos(a), y1 = 110 + r1*Math.sin(a);
    const x2 = 110 + r2*Math.cos(a), y2 = 110 + r2*Math.sin(a);
    const op = (currentState==='mute'||currentState==='offline') ? 0.04 : 0.22 + barsData[i]*0.58;
    html += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#00A8FF" stroke-width="1.8" stroke-opacity="${op.toFixed(2)}" stroke-linecap="round"/>`;
  }
  document.getElementById('bars').innerHTML = html;
  requestAnimationFrame(animate);
}

/* ── WebSocket ── */
function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    clearTimeout(reconnectTimer);
    document.getElementById('connDot').className   = 'conn-dot on';
    document.getElementById('connLabel').textContent = 'CONNECTED';
    log('sys', '[ UI connected to Jarvis backend ]');
    applyState('standby');
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'state') applyState(msg.state);
    if (msg.type === 'log')   log(msg.kind, msg.text);
  };

  ws.onclose = () => {
    document.getElementById('connDot').className   = 'conn-dot';
    document.getElementById('connLabel').textContent = 'RECONNECTING';
    applyState('offline');
    log('err', '[ Connection lost — retrying in 3s... ]');
    reconnectTimer = setTimeout(connect, 3000);
  };

  ws.onerror = () => ws.close();
}

/* ── Manual input (type commands from the UI) ── */
document.getElementById('sendBtn').onclick = () => {
  const inp = document.getElementById('cmdInput');
  const val = inp.value.trim();
  if (!val || !ws || ws.readyState !== WebSocket.OPEN) return;
  log('cmd', '[Manual]: ' + val);
  inp.value = '';
};
document.getElementById('cmdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('sendBtn').click();
});

/* ── Uptime ── */
setInterval(() => {
  const s = Math.floor((Date.now()-startTime)/1000);
  const m = Math.floor(s/60), sc = s%60;
  document.getElementById('uptimeVal').textContent =
    String(m).padStart(2,'0') + ':' + String(sc).padStart(2,'0');
}, 1000);

animate();
connect();
</script>
</body>
</html>
